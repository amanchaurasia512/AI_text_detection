[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-text-audit"
version = "0.1.0"
description = "Local command-line AI-writing detection research pipeline"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "PyMuPDF>=1.24",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17", "Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
ai-text-audit = "ai_text_audit.cli:main"
ai-text-audit-ollama-benchmark = "ai_text_audit.ollama_benchmark:main"
ai-text-audit-ollama-concurrency-benchmark = "ai_text_audit.ollama_concurrency_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
